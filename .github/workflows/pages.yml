name: Publication du site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Reconstruction quotidienne : publie les articles datés dans le futur
    - cron: "0 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.147.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - id: pages
        uses: actions/configure-pages@v5

      - name: Compilation du site
        # Adresse du site : la variable de dépôt SITE_URL (Settings > Secrets and variables
        # > Actions > Variables) si elle existe, sinon l'adresse fournie par GitHub Pages
        # (qui tient compte du domaine personnalisé déclaré dans Settings > Pages).
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          BASE="${SITE_URL:-$PAGES_URL}"
          echo "Adresse du site : ${BASE%/}/"
          hugo --minify --baseURL "${BASE%/}/"

      - name: Index de recherche
        run: npx --yes pagefind@1.3.0 --site public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
