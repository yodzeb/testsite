<!DOCTYPE html>
<html lang="fr">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip" href="#contenu">Aller au contenu</a>
  {{ partial "header.html" . }}
  <main id="contenu">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ $js := resources.Get "js/main.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" defer></script>
</body>
</html>
