<!DOCTYPE html>
{{ $mode := (site.Params.theme | default dict).mode | default "auto" }}
<html lang="fr"{{ if eq $mode "clair" }} data-theme="light"{{ else if eq $mode "sombre" }} data-theme="dark"{{ end }}>
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip" href="#contenu">Aller au contenu</a>
  {{ partial "header.html" . }}
  <main id="contenu">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ $js := resources.Get "js/main.js" | minify | fingerprint }}
  <script src="{{ $js.RelPermalink }}" defer></script>
</body>
</html>
