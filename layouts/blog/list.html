{{ define "main" }}
<div class="wrap">
  <header class="page-head">
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div class="lead">{{ . }}</div>{{ end }}
    {{ with site.Taxonomies.tags }}
    <ul class="tags">
      {{ range .Alphabetical }}
      <li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }} <span class="muted">({{ .Count }})</span></a></li>
      {{ end }}
    </ul>
    {{ end }}
  </header>
  {{ partial "post-list.html" . }}
</div>
{{ end }}
